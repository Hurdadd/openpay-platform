name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Compose
        run: docker compose config
      - name: Build payment-orchestrator adapter
        run: ./gradlew :payment-orchestrator:adapter:build --console=plain
      - name: Build ledger-service adapter
        run: ./gradlew :ledger-service:adapter:build --console=plain
      - name: Build runnable bootstraps
        run: ./gradlew :payment-orchestrator:bootstrap:build :ledger-service:bootstrap:build --console=plain
