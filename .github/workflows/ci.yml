name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build payment-orchestrator adapter
        run: ./gradlew :payment-orchestrator:adapter:build --console=plain
      - name: Build ledger-service (includes money-path grep check + Testcontainers tests)
        run: ./gradlew :ledger-service:adapter:build --console=plain
