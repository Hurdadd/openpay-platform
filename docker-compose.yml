services:
  postgres:
    image: postgres:17
    container_name: openpay-postgres
    environment:
      POSTGRES_USER: openpay
      POSTGRES_PASSWORD: openpay
      POSTGRES_DB: openpay
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine
    container_name: openpay-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-openpay-redis}
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.0
    container_name: openpay-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "openpay-kafka-cluster-001"
    ports:
      - "9092:9092"

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: openpay-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server kafka:29092 --topic payment-events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server kafka:29092 --topic payment-events.DLT --partitions 3 --replication-factor 1 --if-not-exists

  payment-orchestrator:
    build:
      context: .
      args:
        MODULE: payment-orchestrator
    container_name: openpay-payment-orchestrator
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/openpay
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-openpay-redis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    restart: on-failure

  ledger-service:
    build:
      context: .
      args:
        MODULE: ledger-service
    container_name: openpay-ledger-service
    depends_on:
      - postgres
      - kafka
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/openpay_ledger
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${LEDGER_PORT:-8081}:8081"
    restart: on-failure

volumes:
  pgdata:
