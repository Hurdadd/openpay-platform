spring:
  application:
    name: open-psp
  data:
    redis:
      host: localhost
      port: 6379
      password: 1234
      timeout: 2000ms
      connect-timeout: 1000ms

  kafka:

    bootstrap-servers:
      localhost:9092

psp:
  secrets:
    slow-psp: "dev-secret-change-me"

reconciler:
  stuck-threshold: 2m
  poll-interval: 30s
  max-age: 24h


outbox:
    kafka:
      topic: payment-events
